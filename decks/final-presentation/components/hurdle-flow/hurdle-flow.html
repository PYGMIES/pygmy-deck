<div class="c-hurdle {{class|}}">
  <div class="c-hurdle__arms">
    <div class="c-hurdle__arm">
      <small>Calibrated classifier</small>
      <strong>p</strong>
      <span>Chance the fade wins</span>
    </div>
    <div class="c-hurdle__arm">
      <small>Gain regressor</small>
      <strong>E[gain]</strong>
      <span>$ won if it wins</span>
    </div>
    <div class="c-hurdle__arm">
      <small>Loss regressor</small>
      <strong>E[loss]</strong>
      <span>$ lost if it loses</span>
    </div>
  </div>
  <i class="c-hurdle__down" aria-hidden="true"></i>
  <div class="c-hurdle__ev">
    <small>Gross EV</small>
    <strong>p × E[gain] − (1 − p) × E[loss]</strong>
  </div>
  <i class="c-hurdle__down" aria-hidden="true"></i>
  <div class="c-hurdle__decision">
    <small>Decision</small>
    <strong>score = EV − 7.00 × amount</strong>
    <span>Fade if the score is in the top 5% of the frozen pool</span>
  </div>
</div>
