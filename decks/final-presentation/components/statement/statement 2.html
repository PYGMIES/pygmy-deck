<!-- Accent icon over one big display sentence; wrap the key phrase in <mark>.
     Children (e.g. pill-note) go underneath. -->
<div class="c-statement {{class|}}">
  <i class="c-statement__icon reveal" style="--icon: url({{icon}});" aria-hidden="true"></i>
  <h2 class="reveal">{{text}}</h2>
{{children}}
</div>
