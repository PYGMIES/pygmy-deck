<!-- Four phases as big icon cards joined by arrows: Plan, Build, Review, Retro. -->
<div class="c-phase-flow {{class|}}">
  <div class="c-phase-flow__card reveal"><i style="--icon: url(assets/icons/clipboard.svg);" aria-hidden="true"></i><h3>Plan</h3></div>
  <div class="c-phase-flow__card reveal"><i style="--icon: url(assets/icons/bolt.svg);" aria-hidden="true"></i><h3>Build</h3></div>
  <div class="c-phase-flow__card reveal"><i style="--icon: url(assets/icons/eye.svg);" aria-hidden="true"></i><h3>Review</h3></div>
  <div class="c-phase-flow__card reveal"><i style="--icon: url(assets/icons/loop.svg);" aria-hidden="true"></i><h3>Retro</h3></div>
</div>
