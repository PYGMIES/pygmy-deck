<!-- Charcoal card: circled number + accent icon on top, title, body. Use <code> in the body for commands. -->
<article class="c-step-card reveal {{class|}}">
  <div class="c-step-card__top">
    <span class="c-step-card__num">{{num}}</span>
    <i style="--icon: url({{icon}});" aria-hidden="true"></i>
  </div>
  <h3>{{title}}</h3>
  <p>{{body}}</p>
</article>
