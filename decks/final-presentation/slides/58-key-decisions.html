<!-- notes: Three decisions shaped the auto-retrainer. When to retrain: accumulate eight campaigns and run automatically; we rejected retraining on every campaign, by hand or on a cron job, because we want enough data and a fixed rule. The trade-off is that two campaigns a week means about a monthly run. Where it trains: in a separate container, not inside the app or the Judge, so changes stay independent and the dependencies are not duplicated; the trade-off is one more container to manage. How to promote: the evaluator recommends and C22 decides, because a new model affects future campaigns; the trade-off is manual intervention and no alert in a localised deployment. -->
