<!-- notes: We wait for eight finished campaigns and then retrain without anyone pressing a button. We turned down retraining after every campaign, by hand or on a schedule: a run needs enough new data, and a fixed count lets the app decide by itself. The cost is timing. At two campaigns a week, that is roughly one run a month. -->
