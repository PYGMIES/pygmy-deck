<!-- notes: Steps 8 to 11. The poller and the evaluator are not separate services: they are two background loops inside the FastAPI app, started with it (main.py), each running every 30 seconds. Only the trainer runs in its own container. The trainer tells nobody when a job ends, so the poller asks it "done yet?" (GET /train/{run_id}) for every unfinished run, and writes the answer on the run. A 404 means the trainer restarted and lost the job, and a run still unfinished after 2 hours is failed; either way it stops blocking the next run. When the answer is SUCCEEDED, the poller saves the new model as a challenger: a model version that is stored but not live. The evaluator then downloads the predictions file the trainer uploaded to Supabase, checks it is the exact file (sha256), grades the challenger against the live model and stores one recommendation on the dashboard. Nobody gets a message: the operator checks Judge Performance. Source: project-cassandra main.py, poll_training_runs.py, grade_challengers.py. -->
