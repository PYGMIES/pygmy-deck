<!-- notes: Steps 12 and 13. The evaluator only recommends; a person promotes. The operator reads the recommendation and its reasons, then presses Promote on the dashboard, which calls the FastAPI app (POST /models/{id}/promote). Promotion is refused while a campaign is live (one campaign would be scored by two models) or while a run is unfinished. The order is what makes it safe: first the Judge loads the new bundle from Supabase, and only then does the app switch the active model version in the database. If the Judge can't load it, nothing changes and the old model keeps scoring. The switch takes effect from the next trade. Every model is kept, so rolling back is just promoting an older one, and on every app start the Judge reloads whichever model is active. Source: project-cassandra promote_model.py, load_active_model.py, doc/client/EVALUATOR.md. -->
