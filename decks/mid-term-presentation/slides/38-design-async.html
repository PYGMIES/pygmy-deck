Script: Our first decision was to process trades asynchronously. Every trade needs a Judge score and a market price from OANDA, about 350 milliseconds each. If the API did that work before replying, trades would pile up behind each other: with 500 traders, the last one would wait around three minutes. So the API only saves the trade, puts it on a Redis queue, and replies in about a millisecond. A pool of workers then takes trades off the queue and processes them in parallel. -->
