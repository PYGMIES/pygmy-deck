<!-- notes: Yanting. Before the final 18, some features we built didn't make the cut, for two reasons.
Leakage: the model sees information it wouldn't have yet, like a student seeing the exam answers. It scores brilliantly in testing, then fails for real. All six came from the stop-loss and take-profit columns, which hold the final levels saved when the trade closed, not what was set at the start. 15% of stop-losses had been moved into profit, and 37.7% of trades ended exactly at one of these levels.
Didn't pay: fair to use, but on 9 campaigns the model had never seen, adding them made our top-5% bets lose more. Same-day habits (trading bigger after a loss, switching buy/sell, jumping back in within 60 seconds): −$1,591 without, −$9,162 with. Market data (chasing a recent price jump, trading with the trend, how volatile the market is): +$1,205 without, −$3,515 with. Predicted stop-loss (p_sl, a separate model's guess of whether this customer sets a stop-loss) overlapped 90% with the stop-loss habit feature we already had, so it added nothing new. -->
