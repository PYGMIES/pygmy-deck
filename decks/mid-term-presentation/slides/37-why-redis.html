<!-- notes: Jerrick. Script: Why Redis? Our main motivation was to keep the system small and fast. Redis already holds our feature cache and live events. A separate broker like Kafka or RabbitMQ would put a second system on every trade's path: workers would talk to a broker and a cache over the network, and we'd have two systems to run and keep in sync. With one in-memory Redis on the same Docker network, queues, cache and live events live in one place. -->
