<!-- notes: James Z. Six requirements in two groups. Data reliability: trade records are stored regardless of operating conditions, with outcomes and exceptions recorded; every trade ends in an explicit success or failure. Consistency under concurrency: several workers write to the same Redis state at once; rolling metrics stay aligned and uncorrupted when trades update at the same time. Idempotency: duplicate, overlapping or retried requests are processed safely, with no state mutation and no double-counting; replayed payloads are recognised. Processing latency: the ingestion API never blocks the caller, and downstream processing is fast enough to handle trades on time. Concurrency and throughput: the system scales to sustain up to hundreds of concurrent trades per minute. Auditability: all execution context, judge decisions and errors are recorded and can be traced to a root cause. -->
