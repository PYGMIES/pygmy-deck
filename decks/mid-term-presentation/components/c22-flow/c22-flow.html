<div class="c-c22-flow {{class|}}">
  <div class="c-c22-flow__step reveal">
    <span class="c-c22-flow__tag">&nbsp;</span>
    <div class="c-c22-flow__box">
      <div class="c-c22-flow__icon" style="--icon: url(assets/icons/discord.svg)"></div>
      <p class="c-c22-flow__sub">Trading challenge announced<br>2–3× a week</p>
    </div>
  </div>
  <svg class="c-c22-flow__arrow" viewBox="0 0 48 40" aria-hidden="true"><path d="M2 14h22V4l22 16-22 16V26H2z"/></svg>

  <div class="c-c22-flow__step reveal">
    <span class="c-c22-flow__tag">Campaign</span>
    <div class="c-c22-flow__box">
      <h3>~500 traders</h3>
      <p class="c-c22-flow__sub">Join each time</p>
    </div>
  </div>
  <svg class="c-c22-flow__arrow" viewBox="0 0 48 40" aria-hidden="true"><path d="M2 14h22V4l22 16-22 16V26H2z"/></svg>

  <div class="c-c22-flow__step reveal">
    <span class="c-c22-flow__tag">Trader</span>
    <div class="c-c22-flow__box">
      <h3>Sim trades</h3>
      <p class="c-c22-flow__sub">Trade in a simulated env</p>
    </div>
  </div>
  <svg class="c-c22-flow__arrow" viewBox="0 0 48 40" aria-hidden="true"><path d="M2 14h22V4l22 16-22 16V26H2z"/></svg>

  <div class="c-c22-flow__step c-c22-flow__step--focus reveal">
    <span class="c-c22-flow__tag">Our focus</span>
    <div class="c-c22-flow__box">
      <h3>The Judge</h3>
      <p class="c-c22-flow__sub">Fade the trade or not?</p>
    </div>
  </div>
  <svg class="c-c22-flow__arrow" viewBox="0 0 48 40" aria-hidden="true"><path d="M2 14h22V4l22 16-22 16V26H2z"/></svg>

  <div class="c-c22-flow__step c-c22-flow__step--market reveal">
    <span class="c-c22-flow__tag">C22</span>
    <div class="c-c22-flow__box">
      <h3>Real market</h3>
      <p class="c-c22-flow__sub">Live trade placed for profit</p>
    </div>
  </div>
</div>
