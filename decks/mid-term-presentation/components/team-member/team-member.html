<article class="c-team-member reveal {{class|}}" style="--photo: url({{photo|}}); --focus: {{focus|50% 30%}};">
  <span class="c-team-member__initial" aria-hidden="true">{{initial}}</span>
  <div class="c-team-member__photo" role="img" aria-label="{{name}}"></div>
  <div class="c-team-member__text">
    <span class="c-team-member__role">{{role}}</span>
    <h3>{{name}}</h3>
  </div>
</article>
