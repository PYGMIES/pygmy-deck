<section class="c-feature-group reveal {{class|}}" style="--cols: {{cols|1}};">
  <header class="c-feature-group__head">
    <span class="c-feature-group__count">{{count}}</span>
    <div>
      <h3>{{title}}</h3>
      <p>{{note|}}</p>
    </div>
  </header>
  <ul class="c-feature-group__list">
    {{children}}
  </ul>
  <p class="c-feature-group__foot">{{foot|}}</p>
</section>
