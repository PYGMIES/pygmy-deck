<header class="c-dd-heading {{class|}}">
  <div class="c-dd-heading__text">
    <span class="c-dd-heading__kicker" data-morph="ddk-{{kicker}}">{{kicker}}</span>
    <h1 data-morph="ddt-{{title}}">{{title}}</h1>
    <p class="c-dd-heading__sub" data-morph="dds-{{sub|}}">{{sub|}}</p>
    <p class="c-dd-heading__tag c-dd-heading__tag--{{tone|good}}" data-morph="ddg-{{tag|}}">{{tag|}}</p>
  </div>
  {{children}}
</header>
