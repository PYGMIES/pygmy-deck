<!-- markers live in the first slide that defines them (ids repeat per slide), which is hidden via visibility; markers inherit it, so force visible -->
<div class="c-flow-stage {{class|}}" data-morph-scope>
  <svg class="c-flow-stage__defs" width="0" height="0" aria-hidden="true">
    <defs>
      <marker id="flow-head-ink" viewBox="0 0 12 12" refX="10" refY="6" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" orient="auto">
        <path d="M1.5 1.5 L10 6 L1.5 10.5" fill="none" style="visibility: visible; stroke: var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="flow-head-danger" viewBox="0 0 12 12" refX="10" refY="6" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" orient="auto">
        <path d="M1.5 1.5 L10 6 L1.5 10.5" fill="none" style="visibility: visible; stroke: var(--danger)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
  </svg>
  {{children}}
</div>
