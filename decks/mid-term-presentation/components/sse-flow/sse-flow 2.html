<div class="c-sse-flow fk-canvas {{class|}}">
  <!-- The live path: every hop is one-way -->
  <div class="fk-node fk-node--dark" style="left: 0; top: 50px; width: 300px; height: 120px;">Workers</div>
  <div class="fk-node fk-node--pill" style="left: 440px; top: 50px; width: 340px; height: 120px;">Redis<small>pub/sub</small></div>
  <div class="fk-node fk-node--dark" style="left: 920px; top: 50px; width: 340px; height: 120px;">FastAPI<small>/live-trades/stream</small></div>
  <div class="fk-node fk-node--outline fk-node--accent" style="left: 1400px; top: 50px; width: 328px; height: 120px;">Dashboard<small>browser</small></div>

  <!-- WebSocket: two-way, more than we need -->
  <div class="fk-lane" style="left: 0; top: 280px; width: 1728px; height: 160px;"></div>
  <span class="fk-callout" style="left: 48px; top: 336px; color: var(--ink-muted);">WebSocket</span>
  <div class="fk-node fk-node--dim" style="left: 520px; top: 318px; width: 220px; height: 84px; font-size: 28px;">Server</div>
  <div class="fk-node fk-node--dim" style="left: 920px; top: 318px; width: 220px; height: 84px; font-size: 28px;">Browser</div>
  <span class="fk-label fk-label--plain" style="left: 1210px; top: 340px; font-size: 28px; color: var(--ink-muted);">two-way: we never send back</span>

  <!-- SSE: exactly the one-way push we need -->
  <div class="fk-lane fk-node--accent reveal" style="left: 0; top: 490px; width: 1728px; height: 160px;"></div>
  <span class="fk-callout" style="left: 48px; top: 546px;">SSE ✓</span>
  <div class="fk-node fk-node--dark" style="left: 520px; top: 528px; width: 220px; height: 84px; font-size: 28px;">Server</div>
  <div class="fk-node fk-node--outline" style="left: 920px; top: 528px; width: 220px; height: 84px; font-size: 28px;">Browser</div>
  <span class="fk-label fk-label--plain" style="left: 1210px; top: 534px; font-size: 28px;">one-way · plain HTTP<br>reconnects by itself</span>

  <svg class="fk-wires" viewBox="0 0 1728 720" aria-hidden="true">
    <defs>
      <marker id="fk-sse-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
        <path d="M1 1 L10 6 L1 11" fill="none" stroke="currentColor" stroke-width="2.6"/>
      </marker>
    </defs>
    <g class="fk-flow">
      <path d="M304 110 H434" marker-end="url(#fk-sse-arrow)"/>
      <path d="M784 110 H914" marker-end="url(#fk-sse-arrow)"/>
      <path d="M1264 110 H1394" marker-end="url(#fk-sse-arrow)"/>
      <path d="M744 570 H914" marker-end="url(#fk-sse-arrow)"/>
    </g>
    <g class="fk-muted">
      <path d="M750 360 H910" marker-start="url(#fk-sse-arrow)" marker-end="url(#fk-sse-arrow)"/>
    </g>
  </svg>
  <span class="fk-label" style="left: 318px; top: 66px;">publish</span>
  <span class="fk-label" style="left: 796px; top: 66px;">subscribe</span>
  <span class="fk-label" style="left: 1288px; top: 66px;">stream</span>
</div>
