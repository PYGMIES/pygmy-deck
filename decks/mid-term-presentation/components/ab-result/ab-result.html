<section class="c-ab-result reveal {{class|}}" style="--span: {{span|1}};">
  <h3>{{title}}</h3>
  <div class="c-ab-result__tiles">
    <div class="c-ab-result__tile is-a">
      <span class="c-ab-result__label">{{a-label}}</span>
      <span class="c-ab-result__value">{{a-value}}</span>
    </div>
    <div class="c-ab-result__tile is-b">
      <span class="c-ab-result__label">{{b-label}}</span>
      <span class="c-ab-result__value">{{b-value}}</span>
    </div>
  </div>
  <p class="c-ab-result__caption">{{caption|}}</p>
  <p class="c-ab-result__body">{{body|}}</p>
  <p class="c-ab-result__foot">{{foot|}}</p>
</section>
