<div class="c-quadrant {{class|}}">
  <span class="c-quadrant__y">{{y-axis|}}</span>
  <span class="c-quadrant__col">{{col-a}}</span>
  <span class="c-quadrant__col">{{col-b}}</span>
  <span class="c-quadrant__row c-quadrant__row--a">{{row-a}}</span>
  <span class="c-quadrant__row c-quadrant__row--b">{{row-b}}</span>
  <div class="c-quadrant__cells">
    {{children}}
  </div>
  <span class="c-quadrant__x">{{x-axis|}}</span>
</div>
